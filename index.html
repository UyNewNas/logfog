<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f6ee">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>LogFog · 工时描述混淆器</title>
<style>
:root {
  --paper: #f6f6ee;
  --ink: #22251f;
  --muted: #62665b;
  --line: #d4d6c9;
  --acid: #c0f654;
  --dark: #21261f;
  --mono: "IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --base: "Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--base);
  -webkit-font-smoothing: antialiased;
}
button,textarea {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: .46;
}
button:focus-visible,a:focus-visible,input:focus-visible+span {
  outline: 3px solid #598a19;
  outline-offset: 3px;
}
button svg {
  flex: none;
}
svg {
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.wrap {
  max-width: 1200px;
  padding: 0 44px;
  margin: auto;
}
.top {
  border-bottom: 1px solid var(--line);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 68px;
}
.brand,.top-end,.local,.history-btn,.panel-title,.micro,.action,.group-title,.examples-head,.sample-top,.footer,.result-actions,.card-head {
  display: flex;
  align-items: center;
}
.brand {
  gap: 10px;
  font: 700 23px/1 var(--mono);
  letter-spacing: -1.9px;
}
.mark {
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--acid);
  height: 33px;
  width: 33px;
  border-radius: 7px;
}
.mark svg {
  width: 25px;
  height: 25px;
  stroke-width: 2.4;
}
.top-end {
  gap: 22px;
}
.local {
  gap: 7px;
  font-size: 12px;
  color: #4e5948;
}
.dot {
  background: #78a42c;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.history-btn,.light-text,.swap {
  background: none;
  border: 0;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 0;
  font-size: 13px;
}
.history-btn {
  border-left: 1px solid var(--line);
  padding-left: 22px;
}
.history-btn:hover,.light-text:hover {
  text-decoration: underline;
  text-underline-offset: 4px;
}
.ico {
  width: 17px;
  height: 17px;
}
.hero {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 33px 0 31px;
}
.hero h1 {
  font-size: clamp(36px,4.1vw,57px);
  letter-spacing: -.055em;
  line-height: 1.2;
  margin: 0 0 11px;
  font-weight: 800;
}
.hero p {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.65;
  margin: 0;
}
.art {
  width: 30%;
  height: 115px;
  flex: none;
  opacity: .98;
}
.desk {
  display: grid;
  gap: 18px;
  grid-template-columns: minmax(0,1fr) minmax(0,1fr);
}
.panel {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  min-width: 0;
  background: #fdfdf8;
  display: flex;
  flex-direction: column;
}
.card-head {
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 17px;
}
.panel-title {
  gap: 9px;
}
.panel-title .ico {
  width: 20px;
  height: 20px;
}
.panel-title h2,.examples-head h2 {
  font-size: 18px;
  line-height: 1.3;
  letter-spacing: -.04em;
  margin: 0;
}
.light-text {
  color: var(--muted);
  font-size: 12px;
}
.input-wrap {
  background: #f6f7ef;
  border: 1px solid #d8dbce;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  min-height: 137px;
}
.input-wrap:focus-within {
  border-color: #789940;
  box-shadow: 0 0 0 2px #a4ca5b38;
}
textarea {
  width: 100%;
  height: 114px;
  padding: 14px 15px 0;
  font-size: 16px;
  line-height: 1.8;
  resize: vertical;
  border: none;
  outline: 0;
  background: transparent;
  color: var(--ink);
}
textarea::placeholder {
  color: #767b70;
}
.count {
  align-self: flex-end;
  margin: 3px 12px 8px;
  color: var(--muted);
  font: 11px/1.3 var(--mono);
}
fieldset {
  border: 0;
  margin: 16px 0 18px;
  padding: 0;
  min-width: 0;
}
legend {
  font-size: 12px;
  color: #50574c;
  margin-bottom: 8px;
  padding: 0;
}
.modes {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 5px;
}
.mode {
  position: relative;
  min-width: 0;
}
.mode input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.mode span {
  height: 37px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}
.mode input:checked+span {
  background: #e9f8cb;
  color: #2c3c1a;
  border-color: #809a5e;
  font-weight: 650;
}
.bars {
  font-style: normal;
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}
.bars i {
  display: block;
  width: 2px;
  background: currentColor;
}
.bars i:nth-child(1) {
  height: 4px;
}
.bars i:nth-child(2) {
  height: 8px;
}
.bars i:nth-child(3) {
  height: 12px;
}
.b1 i:nth-child(n+2),.b2 i:last-child {
  opacity: .23;
}
.action {
  justify-content: center;
  gap: 8px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 650;
  min-height: 43px;
  padding: 8px 16px;
}
.generate {
  width: 100%;
  position: relative;
  border: 1px solid #a4d840;
  background: var(--acid);
  margin-top: auto;
}
.generate:hover:not(:disabled) {
  background: #b2ec43;
}
.key {
  position: absolute;
  right: 12px;
  border: 1px solid #9dc842;
  background: #b8ea53;
  border-radius: 4px;
  padding: 3px 5px;
  font: 10px var(--mono);
  letter-spacing: .04em;
}
.output {
  background: var(--dark);
  color: #f5f6e9;
  border-color: var(--dark);
}
.output .panel-title .ico {
  color: var(--acid);
}
.style-tag {
  color: #d2e4bd;
  font-size: 11px;
  border: 1px solid #56634e;
  padding: 3px 8px;
  border-radius: 20px;
}
.result-frame {
  flex: 1;
  padding: 10px 0 24px;
  min-height: 170px;
}
.quote {
  width: 25px;
  height: 20px;
  color: var(--acid);
  margin-bottom: 10px;
}
.body-copy {
  font-size: clamp(18px,1.6vw,22px);
  line-height: 1.75;
  letter-spacing: .014em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  max-height: 270px;
  overflow-y: auto;
  scrollbar-color: #78806e transparent;
}
.body-copy.empty {
  color: #adb5a6;
  font-size: 16px;
}
.result-actions {
  border-top: 1px solid #46503f;
  justify-content: space-between;
  padding-top: 16px;
  gap: 10px;
}
.swap {
  color: #e0e6d6;
  padding: 8px 0;
}
.swap:hover:not(:disabled) {
  color: var(--acid);
}
.copy {
  background: #f0f3e6;
  border: 1px solid #e4e9da;
  color: #252b20;
  min-height: 39px;
  font-size: 13px;
}
.copy:hover:not(:disabled) {
  background: white;
}
.examples {
  margin-top: 27px;
}
.examples-head {
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}
.examples-head h2 {
  font-size: 16px;
}
.example-hint {
  font-size: 12px;
  color: var(--muted);
}
.samples {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 12px;
}
.sample {
  text-align: left;
  background: #f9faf2;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 14px 15px;
  min-width: 0;
}
.sample:hover {
  background: #eff5e2;
  border-color: #9eaf8c;
}
.sample-top {
  gap: 9px;
}
.sample-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid #cfdbb6;
  background: #edf3e0;
  color: #414e2f;
  border-radius: 6px;
}
.sample-name {
  font-size: 14px;
  font-weight: 650;
}
.go {
  margin-left: auto;
  color: #727967;
  width: 15px;
  height: 15px;
}
.sample p {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
}
.footer {
  border-top: 1px solid var(--line);
  margin: 24px 0 0;
  padding: 14px 0 24px;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.footer .ico {
  width: 14px;
  height: 14px;
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #30372a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 7px;
  box-shadow: 0 3px 15px #0002;
  font-size: 13px;
  text-align: center;
  max-width: 90vw;
  z-index: 4;
}
.toast:empty {
  display: none;
}
dialog {
  border: 1px solid var(--line);
  padding: 0;
  border-radius: 13px;
  background: #fbfbf5;
  color: var(--ink);
  width: min(500px,92vw);
  max-height: 80vh;
  box-shadow: 0 18px 80px #0003;
}
dialog::backdrop {
  background: #1d241a70;
}
.modal-head {
  position: sticky;
  top: 0;
  background: #fbfbf5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 {
  font-size: 18px;
  margin: 0;
}
.close {
  border: 0;
  background: transparent;
  padding: 7px;
  display: grid;
  place-items: center;
}
.history {
  padding: 15px 20px 20px;
}
.history p.note {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 12px;
}
.hist {
  display: block;
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px;
  width: 100%;
  text-align: left;
  margin: 8px 0 0;
}
.hist:hover {
  background: #edf4e2;
}
.hist b {
  font-size: 12px;
  color: var(--muted);
}
.hist p {
  font-size: 14px;
  margin: 4px 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media(max-width:850px) {
  .wrap {
    padding: 0 22px;
  }
  .panel {
    padding: 18px;
  }
  .desk {
    gap: 12px;
  }
  .mode span {
    font-size: 12px;
    gap: 4px;
  }
  .key {
    display: none;
  }
  .art {
    height: 96px;
  }
}
@media(max-width:650px) {
  .wrap {
    padding: 0 16px;
  }
  .nav {
    min-height: 54px;
  }
  .brand {
    font-size: 20px;
  }
  .mark {
    width: 29px;
    height: 29px;
  }
  .top-end {
    gap: 10px;
  }
  .history-btn {
    padding-left: 10px;
  }
  .hero {
    padding: 26px 0 22px;
  }
  .hero h1 {
    font-size: clamp(29px,7.4vw,40px);
    margin-bottom: 7px;
  }
  .hero p {
    font-size: 13px;
  }
  .art {
    width: 22%;
    height: 60px;
  }
  .desk {
    grid-template-columns: 1fr;
  }
  .panel {
    padding: 17px;
  }
  .card-head {
    margin-bottom: 12px;
  }
  textarea {
    height: 86px;
    font-size: 16px;
  }
  .input-wrap {
    min-height: 108px;
  }
  fieldset {
    margin: 13px 0;
  }
  .mode span {
    font-size: 13px;
  }
  .result-frame {
    min-height: 122px;
    padding: 4px 0 18px;
  }
  .body-copy {
    font-size: 18px;
  }
  .result-actions {
    padding-top: 11px;
  }
  .samples {
    grid-template-columns: 1fr;
    gap: 7px;
  }
  .sample {
    padding: 10px 12px;
  }
  .sample p {
    margin: 4px 0 0 37px;
  }
  .examples {
    margin-top: 21px;
  }
  .footer {
    margin-top: 17px;
  }
  .local {
    font-size: 11px;
  }
  .quote {
    height: 15px;
    margin-bottom: 6px;
  }
}
@media(max-width:365px) {
  .art {
    display: none;
  }
  .local {
    display: none;
  }
  .history-btn {
    border: 0;
  }
  .example-hint {
    font-size: 11px;
  }
}
</style></head>
<body>
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="logo" viewBox="0 0 28 28"><path d="M4 9h10l-3 4H4m5 3h11l-3 4H7m10-12h7m-4 5h4"/></symbol>
<symbol id="history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.5 7M3 5v6h6m3-4v5l3 2"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M13 4H5v16h14v-8m-9 2 4-.8 7-7-3-3-7 7z"/></symbol>
<symbol id="result" viewBox="0 0 24 24"><path d="M3 6h15M6 12h15M3 18h12"/></symbol>
<symbol id="shuffle" viewBox="0 0 24 24"><path d="M3 6h3c4 0 6 12 11 12h4m-3-3 3 3-3 3M3 18h3c2 0 3-2 4-4m4-5c1-2 2-3 4-3h3m-3-3 3 3-3 3"/></symbol>
<symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
<symbol id="code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></symbol>
<symbol id="team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5"/></symbol>
<symbol id="doc" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zm9 0v6h5M8 13h8m-8 4h6"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
</defs></svg>
<header class="top"><div class="nav wrap"><div class="brand"><span class="mark"><svg aria-hidden="true"><use href="#logo"/></svg></span>LogFog</div><div class="top-end"><span class="local"><span class="dot"></span>离线模式</span><button class="history-btn" id="open-history"><svg class="ico"><use href="#history"/></svg>历史记录</button></div></div></header>
<main class="wrap"><section class="hero"><div><h1>工时描述混淆器</h1><p>同一段工作记录，换种口吻写进日报。</p></div><canvas class="art" id="art" aria-hidden="true"></canvas></section>
<div class="desk"><section class="panel"><div class="card-head"><div class="panel-title"><svg class="ico"><use href="#edit"/></svg><h2><label for="source">原始记录</label></h2></div><button id="clear" class="light-text">清空</button></div>
<div class="input-wrap"><textarea id="source" placeholder="写下做了什么，例如：查了日志，超时原因还没找到。"></textarea><span class="count" id="count"></span></div>
<fieldset><legend>表达风格</legend><div class="modes" id="modes"></div></fieldset>
<button class="action generate" id="generate"><svg class="ico"><use href="#shuffle"/></svg>生成描述<span class="key" id="shortcut" aria-hidden="true">Ctrl ↵</span></button></section>
<section class="panel output"><div class="card-head"><div class="panel-title"><svg class="ico"><use href="#result"/></svg><h2>混淆结果</h2></div><span class="style-tag" id="style-tag"></span></div>
<div class="result-frame"><svg class="quote" viewBox="0 0 28 20" aria-hidden="true" style="fill:currentColor;stroke:none"><path d="m0 18 5-16h7L8 18zm13 0 5-16h7l-4 16z"/></svg><p id="result-text" class="body-copy" aria-live="polite"></p></div>
<div class="result-actions"><button class="swap" id="alternate"><svg class="ico"><use href="#shuffle"/></svg>换个说法</button><button class="action copy" id="copy"><svg class="ico"><use href="#icon-copy"/></svg>复制结果</button></div></section></div>
<section class="examples"><div class="examples-head"><h2>试试这些记录</h2><span class="example-hint">点选示例，查看改写效果</span></div><div class="samples" id="samples"></div></section>
<footer class="footer"><svg class="ico"><use href="#lock"/></svg>文字只在当前页面处理，关闭页面后清除历史。</footer></main>
<dialog id="dialog" aria-labelledby="history-title"><div class="modal-head"><h2 id="history-title">历史记录</h2><button id="close-history" class="close" aria-label="关闭历史记录"><svg class="ico"><use href="#close"/></svg></button></div><div id="history-list" class="history"></div></dialog><div id="notice" class="toast" role="status"></div>
<script id="rewrite-engine">
/* Offline, local rewriting. Each rule keeps its source objects and changes the phrasing. */
(function () {
  'use strict';

  // Each row contains a source pattern and three registers, with optional alternatives.
  // A vertical bar separates alternate phrasings within a register.
  const rules = [
    [/^(?:完成了|已经完成了?|已完成了?)(.+)$/,
      '完成了$1|已做完$1|做完了$1',
      '已完成$1|$1已完成|完成了$1的相关工作',
      '本轮已完成$1|推动$1落地并完成|$1已落实完成'],
    [/^(?:协助|配合)(.+?)(处理|完成|整理|核对|更新|排查|测试|梳理|撰写|准备|推进)(.+)$/,
      '帮$1$2$3|协助$1$2$3|配合$1$2$3',
      '为$1$2$3提供协助|配合$1开展$3的$2工作|协助$1开展$3的$2工作',
      '围绕$3的$2工作为$1提供协同支持|配合$1推进$3的$2工作|在$1$2$3的过程中提供支持'],
    [/^(?:协助|配合)(处理|完成|整理|核对|更新|排查|测试|梳理|撰写|准备|推进)(.+)$/,
      '协助$1$2|帮忙$1$2|配合$1$2',
      '参与$2的$1工作并提供协助|协助开展$2的$1工作|配合开展$2的$1工作',
      '围绕$2的$1工作提供协同支持|配合推进$2的$1工作|在$1$2的过程中提供支持'],
    [/^(?:目前)?正在跟进(.+)$/,
      '正在跟进$1|目前在跟进$1|眼下正在跟进$1',
      '当前正在跟进$1|对$1的跟进正在进行|现阶段正在跟进$1的进展',
      '当前正在跟进$1的推进情况|围绕$1的跟进工作正在进行|正在对$1开展进度跟踪'],
    [/^持续跟进(.+)$/,
      '继续跟进$1|持续跟着$1的进展|一直在跟进$1',
      '持续跟进$1的进展|对$1保持跟进|持续跟踪$1',
      '围绕$1持续跟进进展|持续推进$1的进度跟踪|对$1的进展保持持续跟踪'],
    [/^(?:摸鱼|摸了会儿鱼|摸了会鱼)$/,
      '忙里偷闲|摸了会儿鱼|闲了一会儿',

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.setTransform(scale, 0, 0, scale, (width - 320 * scale) / 2, (height - 110 * scale) / 2);

  const intensity = Math.max(0, Math.min(1, (Number(level) || 0) / 100));
  const pi = Math.PI;
  function point(t, u) {
    const envelope = Math.sin(t * pi);
    const twist = (0.15 + 1.74 * t + intensity * 0.22 * envelope) * pi;
    const span = 22 + 14 * envelope;
    const across = span * u;
    return [
      14 + 292 * t + across * (0.14 + 0.62 * Math.sin(twist)),
      55 - 19 * Math.sin(2.30 * pi * t - 0.23) + across * Math.cos(twist)
        - 5 * (1 - u * u) * Math.sin(twist)
    ];
  }

  function trace(t0, t1, u, start) {
    const count = Math.ceil(Math.abs(t1 - t0) * 100);
    for (let i = 0; i <= count; i++) {
      const p = point(t0 + (t1 - t0) * i / count, u);
      if (start && i === 0) ctx.moveTo(p[0], p[1]);
      else ctx.lineTo(p[0], p[1]);
    }
  }

  const ink = "#24271c";
  const lime = "#c0f654";
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  trace(0, 1, -1, true);
  trace(1, 0, -0.33, false);
  ctx.closePath();
  ctx.fillStyle = lime;
  ctx.fill();

  const strands = Math.max(28, Math.min(50, Math.round(bounds.width / 6.4)));
  for (let i = 0; i < strands; i++) {
    const u = -1 + 2 * i / (strands - 1);
    ctx.beginPath();
    trace(0, 1, u, true);
    ctx.strokeStyle = u < -0.33 ? "#384421" : ink;
    ctx.lineWidth = i === 0 || i === strands - 1 ? 0.88 : u < -0.33 ? 0.39 : 0.66;
    ctx.stroke();
  }
}

</script>
<script>
(() => {
  'use strict';
  const id = value => document.getElementById(value);
  const source = id('source');
  const output = id('result-text');
  const dialog = id('dialog');
  const styles = ['清爽直述', '专业汇报', '大厂黑话'];
  const examples = [
    ['研发测试', 'code', '看了下登录接口的报错日志，修了超时问题，补了 2 条回归用例。'],
    ['项目协作', 'team', '跟产品讨论了退款流程，整理了 3 个待确认的问题，等财务回复。'],
    ['文档整理', 'doc', '核对了 12 张发票，更新了报销清单，还有 2 张待复核。']
  ];
  let level = 1;
  let last = null;
  let history = [];
  let noticeTimer;
  const textCount = value => [...value].length;
  function announce(message) {
    id('notice').textContent = message;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { id('notice').textContent = ''; }, 2050);
  }
  function refreshInput() {
    id('count').textContent = textCount(source.value) + ' 字';
    id('clear').disabled = !source.value;
    id('generate').disabled = !source.value.trim();
  }
  function invalidate() {
    last = null;
    output.textContent = source.value.trim() ? '点击「生成描述」，查看这段记录的新写法。' : '输入工作记录后，改写结果会显示在这里。';
    output.classList.add('empty');
    id('style-tag').textContent = '待生成';
    id('copy').disabled = true;
    id('alternate').disabled = true;
  }
  function draw() { drawInstrument(id('art'), level * 50); }
  function setMode(value) {
    level = value;
    const radio = document.querySelector('input[name="style"][value="' + level + '"]');
    if (radio) radio.checked = true;
    draw();
  }
  function display(entry) {
    last = entry;
    output.textContent = entry.text;
    output.classList.remove('empty');
    id('style-tag').textContent = styles[entry.level];
    id('copy').disabled = false;
    id('alternate').disabled = false;
  }
  function generate({advance = false, remember = true} = {}) {
    const raw = source.value.trim();
    if (!raw) { invalidate(); return; }
    const same = last && last.source === raw && last.level === level;
    const variant = same && advance ? (last.variant + 1) % 3 : 0;
    const entry = {source:raw, level, variant, text:rewriteEntry(raw, level, variant)};
    display(entry);
    if (remember) {
      history = [entry, ...history.filter(item => item.source !== raw || item.level !== level || item.text !== entry.text)].slice(0, 30);
    }
  }
  styles.forEach((name, index) => {
    const label = document.createElement('label');
    label.className = 'mode';
    label.innerHTML = '<input type="radio" name="style" value="' + index + '"><span><i aria-hidden="true" class="bars b' + (index + 1) + '"><i></i><i></i><i></i></i>' + name + '</span>';
    label.firstElementChild.addEventListener('change', () => { setMode(index); generate(); });
    id('modes').append(label);
  });
  examples.forEach(([name, icon, text]) => {
    const btn = document.createElement('button');
    btn.className = 'sample';
    btn.innerHTML = '<span class="sample-top"><span class="sample-icon"><svg class="ico"><use href="#' + icon + '"/></svg></span><span class="sample-name"></span><svg class="go"><use href="#arrow"/></svg></span><p></p>';
    btn.querySelector('.sample-name').textContent = name;
    btn.querySelector('p').textContent = text;
    btn.addEventListener('click', () => {
      source.value = text;
      refreshInput();
      generate();
      announce('已载入' + name + '示例');
      if (window.matchMedia('(max-width:650px)').matches) source.scrollIntoView({block:'center'});
    });
    id('samples').append(btn);
  });
  source.addEventListener('input', () => { refreshInput(); invalidate(); });
  id('clear').addEventListener('click', () => {
    source.value = '';
    refreshInput();
    invalidate();
    source.focus();
  });
  id('generate').addEventListener('click', () => generate({advance:true}));
  id('alternate').addEventListener('click', () => generate({advance:true}));
  source.addEventListener('keydown', e => {
    if (!e.isComposing && (e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      generate({advance:true});
    }
  });
  if (/Mac|iPhone|iPad/i.test(navigator.platform)) id('shortcut').textContent = '⌘ ↵';
  id('copy').addEventListener('click', async () => {
    if (!last) return;
    const content = last.text;
    try {
      await navigator.clipboard.writeText(content);
    } catch {
      const buffer = document.createElement('textarea');
      buffer.style.cssText = 'position:fixed;top:0;left:-9999px';
      buffer.value = content;
      document.body.append(buffer);
      buffer.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { /* Use manual selection below. */ }
      buffer.remove();
      id('copy').focus();
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(output);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        announce('已选中结果，请使用系统复制');
        return;
      }
    }
    announce('已复制结果');
  });
  id('open-history').addEventListener('click', () => {
    const list = id('history-list');
    list.replaceChildren();
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = history.length ? '仅保留本页最近 30 条。点选即可恢复原文和结果。' : '还没有记录。生成一次描述后，可以在这里找回。';
    list.append(note);
    for (const item of history) {
      const btn = document.createElement('button');
      btn.className = 'hist';
      const title = document.createElement('b');
      title.textContent = styles[item.level];
      const text = document.createElement('p');
      text.textContent = item.text;
      btn.append(title, text);
      btn.addEventListener('click', () => {
        source.value = item.source;
        setMode(item.level);
        refreshInput();
        display(item);
        dialog.close();
        announce('已恢复这条记录');
      });
      list.append(btn);
    }
    dialog.showModal();
  });
  id('close-history').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) dialog.close();
  });
  source.value = examples[0][2];
  setMode(1);
  refreshInput();
  generate({remember:false});
  window.addEventListener('resize', draw);
})();

</script>
</body></html>
